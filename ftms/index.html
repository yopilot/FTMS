<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FTMS · Live football scores, tables & manager hub</title>
    <meta name="description" content="Free live football scores from every competition, league tables, squads, player ratings and news, plus a manager hub where you run a real club." />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="FTMS · Football, live" />
    <meta property="og:description" content="Live scores, tables, squads, ratings and a manager hub. Free." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://site.api.espn.com" crossorigin />
    <link rel="preconnect" href="https://a.espncdn.com" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('ftms.theme') || '"system"');
          var theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <style>
      html { background: #0b0c0e; }
      html[data-theme='light'] { background: #f5f6f7; }
    </style>
  </head>
  <body>
    <noscript>FTMS needs JavaScript to show live scores.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
